function renderBenchmarks(root) {
  const all = state.data.benchmarks;
  if (!all.length) {
    root.append(empty('暂无实验结果', '读取已经保存的逐任务对照。'));
    return;
  }
  const chosen = all.find(b => b.id === state.selectedBenchmark) || all.find(b => b.mode === 'real_model') || all[0];

  const list = el('div', 'list');
  for (const b of all) {

      el('div', 'item-meta', b.status || '状态未记录'));

    el('p', 'muted', chosen.model ? pretty(chosen.model) : '模型信息未记录'));

      const button = el('button', part === p ? 'active' : '', part.name);

        answers.append(d);

      n.append(answers);

document.querySelectorAll('[data-view]').forEach(b=>b.onclick=()=>{state.view=b.dataset.view;state.query='';state.status='all';state.mode='all';render()});
function applySnapshot(d,isOffline){if(!d||d.schema_version!==1||!['runs','episodes','candidates','validations','releases','repair_jobs','benchmarks','sources'].every(k=>Array.isArray(d[k])))throw Error('数据格式不兼容，无法解析证据快照。');state.data=d;state.offline=!!isOffline;const timeStr=d.generated_at?new Date(d.generated_at).toLocaleString('zh-CN',{hour12:false}):'未记录时间';if(isOffline){const ro=$('.read-only');if(ro)ro.textContent='离线快照 · READ ONLY';$('#updated').textContent='离线快照 · '+timeStr;const b=$('#refresh');b.disabled=true;b.title='离线单文件快照，不会向本地或外部请求新记录';b.textContent='离线快照 · 不更新';b.onclick=null;const sf=document.querySelector('.side-foot strong');if(sf)sf.replaceChildren(el('span','dot'),document.createTextNode('离线快照 · 只读'));$('#source-count').textContent=d.sources.length+' 个数据源 · 离线快照（只读脱敏投影，分享前请人工核验）';}else{$('#updated').textContent='快照更新 · '+timeStr;$('#source-count').textContent=d.sources.length+' 个数据源 · 手动刷新 · 不触发模型调用';}render();}
async function refresh(){if(state.offline)return;const b=$('#refresh');b.disabled=true;b.textContent='读取中…';$('#error').hidden=true;try{const res=await fetch('/api/snapshot',{cache:'no-store'});if(!res.ok)throw Error('读取失败（HTTP '+res.status+'）');const d=await res.json();applySnapshot(d,false);}catch(e){const err=$('#error');err.className='notice error';err.hidden=false;err.textContent=e.message;if(!state.data)$('#workspace').replaceChildren(empty('暂时无法读取本地数据','请使用项目的 dashboard 命令启动；本页不连接外部服务。'));}finally{if(!state.offline){b.disabled=false;b.textContent='↻ 刷新记录';}}}
function init(){const snapshotEl=document.getElementById('skillforge-snapshot');const raw=snapshotEl?snapshotEl.textContent.trim():'';if(raw){try{const data=JSON.parse(raw);applySnapshot(data,true);}catch(e){const err=$('#error');err.className='notice error';err.hidden=false;err.textContent='离线数据解析失败: '+e.message;if(!state.data)$('#workspace').replaceChildren(empty('离线快照损坏','未能解析内嵌快照 JSON。'));}}else{$('#refresh').onclick=refresh;refresh();}}
init();
</script>
</body>
</html>
