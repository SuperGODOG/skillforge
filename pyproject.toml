[project]
name = "skillforge"
version = "0.1.0"
description = "Agent Skill 自进化元 Agent 系统（个人项目 · 面试演示）"
requires-python = ">=3.10"
authors = [{ name = "cao ruixin" }]
dependencies = [
    "hello-agents==1.0.0",
    "pydantic>=2.0",
    "sentence-transformers",
    "python-dotenv",
    "requests",
    "pyyaml",
    "langgraph>=1.2.11",
]

[project.optional-dependencies]
dev = ["pytest>=7.0"]

[project.scripts]
skillforge = "skillforge.cli:main"

[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]
include = ["skillforge*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
